<!doctype html><html lang="fr"><meta charset="utf-8"><title>Atelier des animaux · Paillette</title>
<style>body{margin:0;background:#f6f0e3;color:#42554d;font:16px system-ui}h1,p{margin:18px 32px}h1{font:28px Georgia}#lab{width:960px;height:560px;margin:0 24px;border-radius:24px;overflow:hidden;background:#dce8c8}canvas{display:block}</style>
<h1>Les compagnons de Paillette</h1><p>Lapin · renard · tortue · hérisson · biche · vache</p><div id="lab"></div>
<script type="module">
import Phaser from '../vendor/phaser/phaser.esm.min.js';
import {RIGGED_ANIMALS,animalParts,animalTurnSVG,createWildlife,poseWildlife,wildlifePose} from '../js/prototype/wildlife.js';
import {uri} from '../js/prototype/art.js';
class Lab extends Phaser.Scene{
 preload(){for(const kind of RIGGED_ANIMALS){for(const [name,part] of Object.entries(animalParts(kind)))this.load.svg('rig-'+kind+'-'+name+'0',uri(part.source),{width:part.width*2,height:part.height*2});this.load.svg('rig-'+kind+'-front',uri(animalTurnSVG(kind,true)),{width:420,height:380});this.load.svg('rig-'+kind+'-quarter',uri(animalTurnSVG(kind,false)),{width:420,height:380});const part=animalParts(kind,true).head;this.load.svg('rig-'+kind+'-head1',uri(part.source),{width:part.width*2,height:part.height*2});}}
 create(){this.seconds=0;this.friends=RIGGED_ANIMALS.map((kind,i)=>createWildlife(this,kind,165+i%3*310,222+Math.floor(i/3)*260,1.25));this.friends.forEach((friend,i)=>{friend.homeX=friend.x;this.add.text(friend.x,friend.y+34,['Lapin','Renard','Tortue','Hérisson','Biche','Vache'][i],{fontSize:'18px',fontFamily:'Georgia',color:'#4c6152'}).setOrigin(.5);});window.__labReady=true;}
 update(_,delta){if(!this.friends)return;this.seconds+=Math.min(delta,80)/1000;this.friends.forEach((friend,i)=>{poseWildlife(friend,this.seconds,i);friend.x=friend.homeX+wildlifePose(friend.kind,this.seconds,i).offset;});}
}
new Phaser.Game({type:Phaser.AUTO,parent:'lab',width:960,height:560,backgroundColor:'#dce8c8',scene:[Lab],audio:{noAudio:true},banner:false});
</script></html>
